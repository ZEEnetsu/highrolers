  <!-- Theme boot: set data-theme before first paint so there is no light/dark flash.
       Mirrors THEME_STORAGE_KEY / DEFAULT_THEME / metaColor in src/data/themes.js.
       First-time visitors start in dark; a saved choice always wins. -->
  <script>
    (function () {
      var theme;
      try { theme = localStorage.getItem('highrolers-theme'); } catch (e) {}
      if (theme !== 'light' && theme !== 'dark') {
        theme = 'dark';
      }
      document.documentElement.setAttribute('data-theme', theme);
      if (theme === 'light') {
        document.querySelector('meta[name="theme-color"]').setAttribute('content', '#FFFFFF');
      }
    })();
  </script>

  <!-- Boot watchdog: if the app fails to start (e.g. a script failed to load or a stale
       dev-server cache), show the reason and a reload button instead of a blank screen.
       React clears this message as soon as the app mounts. -->
  <script>
    (function () {
      var BOOT_TIMEOUT_MS = 8000;
      var problems = [];

      window.addEventListener('error', function (event) {
        var target = event.target;
        var failedFile = target && target !== window && (target.src || target.href);
        problems.push(failedFile ? 'Failed to load ' + failedFile : event.message || 'Unknown error');
      }, true);

      window.addEventListener('unhandledrejection', function (event) {
        var reason = event.reason;
        problems.push(String((reason && reason.message) || reason));
      });

      window.setTimeout(function () {
        var root = document.getElementById('root');
        if (!root || root.childElementCount > 0) return;

        var details = problems.length
          ? problems.slice(0, 4).map(function (p) {
              return p.replace(/[&<>]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]; });
            }).join('<br>')
          : 'No error was reported — the scripts may still be loading.';

        root.innerHTML =
          '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;' +
          'background:#0A0A0C;color:#F4F4F5;font-family:monospace;text-align:center">' +
          '<div style="max-width:560px">' +
          '<p style="letter-spacing:.14em;font-size:12px;opacity:.6">[ HIGHROLERS // BOOT ERROR ]</p>' +
          '<h1 style="font-size:28px;margin:12px 0">The page didn\'t load correctly.</h1>' +
          '<p style="font-size:13px;line-height:1.6;opacity:.8">Please refresh. If it keeps happening, do a hard refresh ' +
          '(Ctrl+Shift+R, or Cmd+Shift+R on Mac).</p>' +
          '<p style="font-size:11px;line-height:1.6;opacity:.5;margin-top:16px;word-break:break-all">' + details + '</p>' +
          '<button onclick="location.reload()" style="margin-top:20px;padding:12px 24px;border-radius:999px;border:0;' +
          'background:#fff;color:#000;font:700 12px monospace;letter-spacing:.1em;cursor:pointer">RELOAD</button>' +
          '</div></div>';
      }, BOOT_TIMEOUT_MS);
    })();
  </script>
